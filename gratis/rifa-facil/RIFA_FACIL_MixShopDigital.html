<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7B4FE0">
<title>RIFA FÁCIL</title>
<style>
:root{
  --tq:#12B5A6;--tq-d:#0B8F84;--co:#FF6B5B;--co-d:#E4503F;--am:#FFC531;--am-d:#E0A400;--vi:#7B4FE0;--vi-d:#5B34C2;--az:#2B6BFF;
  --ink:#231A4A;--mut:#6B6690;--bg:#F5F3FF;--card:#fff;--line:#E5E0F6;--ok:#0B8F84;--err:#D6382B;
  --r:18px;--sh:0 2px 0 rgba(35,26,74,.04),0 8px 24px rgba(61,40,140,.08);
  --f-body:"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;--f-disp:"Trebuchet MS","Arial Rounded MT Bold","Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-disp);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:1.7rem}h2{font-size:1.3rem}h3{font-size:1.1rem}
p{margin:0}
svg.ic{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--az);outline-offset:2px}
.hide{display:none!important}
.mut{color:var(--mut)}.sm{font-size:.88rem}.b{font-weight:700}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.grow{flex:1}
.col{display:flex;flex-direction:column;gap:12px}

/* ---------- estructura ---------- */
#app{display:flex;min-height:100vh}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 24px rgba(61,40,140,.08)}
#nav .brand{display:none}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:56px;border:0;background:none;color:var(--mut);font-size:.72rem;font-weight:600;border-radius:14px;cursor:pointer;padding:6px 2px}
#nav button svg{width:24px;height:24px}
#nav button.on{color:var(--vi);background:#F0EAFF}
#main{flex:1;min-width:0;padding:16px 16px 110px;max-width:1120px;margin:0 auto;width:100%}
@media(min-width:900px){
  #nav{position:sticky;top:0;height:100vh;width:236px;flex:none;flex-direction:column;border-top:0;border-right:1px solid var(--line);padding:18px 12px;gap:6px;box-shadow:none}
  #nav .brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px;font-family:var(--f-disp);font-weight:800;font-size:1.15rem}
  #nav button{flex:none;flex-direction:row;gap:12px;font-size:1rem;min-height:50px;padding:0 14px;justify-content:flex-start}
  #main{padding:26px 32px 60px}
}
.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--tq),var(--vi));display:grid;place-items:center;color:#fff;flex:none}
.logo svg{width:24px;height:24px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top .t{flex:1;min-width:0}
.top .t h1{font-size:1.45rem}
.top .t p{color:var(--mut);font-size:.92rem}
@media(min-width:900px){.top .logo{display:none}}

/* ---------- componentes ---------- */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;border:1px solid var(--line)}
.card.flat{box-shadow:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:15px;border:2px solid transparent;font-weight:700;cursor:pointer;background:#fff;color:var(--ink);border-color:var(--line);transition:transform .12s,box-shadow .12s,background .12s;text-align:center;line-height:1.1}
.btn:active{transform:scale(.97)}
.btn:hover{box-shadow:0 4px 14px rgba(61,40,140,.14)}
.btn.pri{background:linear-gradient(135deg,var(--vi),var(--az));color:#fff;border-color:transparent}
.btn.tq{background:var(--tq);color:#fff}.btn.co{background:var(--co);color:#fff}.btn.am{background:var(--am);color:#3A2A00}
.btn.danger{background:#fff;color:var(--err);border-color:#F4C5BF}
.btn.ghost{background:transparent;border-color:var(--line)}
.btn.sm{min-height:42px;padding:0 14px;font-size:.92rem;border-radius:12px}
.btn.big{min-height:60px;font-size:1.1rem;border-radius:18px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.icbtn{width:46px;height:46px;border-radius:14px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.icbtn:hover{background:#F0EAFF}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.lbl{font-weight:700;font-size:.92rem}
.field .hint{font-size:.82rem;color:var(--mut)}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],select,textarea{width:100%;min-height:50px;padding:10px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:1rem}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vi);box-shadow:0 0 0 4px rgba(123,79,224,.15)}
input[type=color]{width:100%;height:50px;border:2px solid var(--line);border-radius:14px;padding:4px;background:#fff;cursor:pointer}
input[type=range]{width:100%;accent-color:var(--vi);height:34px}
.err{color:var(--err);font-weight:600;font-size:.9rem}
.errbox{background:#FFF1EF;border:2px solid #F4C5BF;border-radius:14px;padding:12px 14px;color:#9B2A1F;font-weight:600;font-size:.93rem;display:flex;flex-direction:column;gap:4px}
.okbox{background:#E8FBF8;border:2px solid #A8E9E1;border-radius:14px;padding:12px 14px;color:#0A6B62;font-weight:600;font-size:.93rem}
.warnbox{background:#FFF8E1;border:2px solid #FFE08A;border-radius:14px;padding:12px 14px;color:#6A4B00;font-size:.93rem}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:44px;padding:0 16px;border-radius:999px;border:2px solid var(--line);background:#fff;font-weight:700;font-size:.92rem;cursor:pointer;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.chip.on{background:var(--vi);border-color:var(--vi);color:#fff}
.chip .n{background:rgba(0,0,0,.08);border-radius:999px;padding:1px 8px;font-size:.8rem}
.chip.on .n{background:rgba(255,255,255,.25)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.seg{display:flex;background:#fff;border:2px solid var(--line);border-radius:15px;padding:3px;gap:3px}
.seg button{flex:1;min-height:44px;border:0;border-radius:12px;background:none;font-weight:700;cursor:pointer;color:var(--mut)}
.seg button.on{background:var(--vi);color:#fff}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.pill.pagado{background:#D8F7F2;color:#08766C}.pill.pendiente{background:#FFE9C7;color:#8A5300}.pill.reservado{background:#FFF1B8;color:#7A5A00}
.pill.cancelada{background:#FFE0DC;color:#A32A1E}.pill.activa{background:#E6F0FF;color:#1D54C9}.pill.finalizada{background:#EDE6FF;color:#5B34C2}.pill.borrador{background:#ECECF4;color:#555}
.pill.bloqueado{background:#FFE0DC;color:#A32A1E}
.toggle{display:flex;align-items:center;gap:12px;min-height:48px;cursor:pointer;font-weight:600}
.toggle input{width:24px;height:24px;accent-color:var(--vi);flex:none}
.empty{text-align:center;padding:34px 18px;color:var(--mut)}
.empty h3{color:var(--ink);margin-bottom:6px}
.bar{height:12px;border-radius:999px;background:#ECE8FA;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.sep{height:1px;background:var(--line);margin:4px 0}

/* ---------- panel ---------- */
.hero{border-radius:24px;padding:22px;color:#fff;background:linear-gradient(135deg,var(--vi) 0%,var(--az) 55%,var(--tq) 130%);position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(91,52,194,.28)}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,197,49,.35)}
.hero::before{content:"";position:absolute;right:60px;bottom:-60px;width:130px;height:130px;border-radius:50%;background:rgba(255,107,91,.4)}
.hero>*{position:relative;z-index:1}
.hero h1{font-size:1.9rem;margin-bottom:4px}
.hero p{opacity:.92;margin-bottom:16px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1000px){.stats.six{grid-template-columns:repeat(3,1fr)}}
.stat{border-radius:20px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:6px;min-height:112px;position:relative;overflow:hidden}
.stat svg{position:absolute;right:10px;top:10px;width:34px;height:34px;opacity:.28}
.stat .k{font-size:.85rem;font-weight:700;opacity:.95;padding-right:34px}
.stat .v{font-family:var(--f-disp);font-size:1.7rem;font-weight:800;line-height:1.05;word-break:break-word}
.stat .s{font-size:.78rem;opacity:.9;margin-top:auto}
.stat.a{background:linear-gradient(135deg,#12B5A6,#0B8F84)}.stat.b2{background:linear-gradient(135deg,#FF6B5B,#E4503F)}.stat.c{background:linear-gradient(135deg,#FFC531,#E8A200);color:#3A2A00}
.stat.d{background:linear-gradient(135deg,#7B4FE0,#5B34C2)}.stat.e{background:linear-gradient(135deg,#2B6BFF,#1D4FCC)}.stat.f{background:linear-gradient(135deg,#FF8A5B,#FF6B5B)}
.quick{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.quick{grid-template-columns:repeat(3,1fr)}}
.q{border:0;border-radius:18px;padding:16px 14px;min-height:96px;background:#fff;box-shadow:var(--sh);border:1px solid var(--line);display:flex;flex-direction:column;align-items:flex-start;gap:10px;cursor:pointer;text-align:left;font-weight:700;font-size:.98rem;transition:transform .15s}
.q:active{transform:scale(.97)}
.q .qi{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:#fff}
.q:nth-child(1) .qi{background:var(--tq)}.q:nth-child(2) .qi{background:var(--co)}.q:nth-child(3) .qi{background:var(--vi)}.q:nth-child(4) .qi{background:var(--am);color:#3A2A00}.q:nth-child(5) .qi{background:var(--az)}.q:nth-child(6) .qi{background:#FF8A5B}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px}
.banner{display:flex;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:#FFF8E1;border:2px solid #FFE08A;margin-bottom:14px;flex-wrap:wrap}
.banner.info{background:#EAF2FF;border-color:#BBD3FF}
.banner .grow{min-width:200px}

/* ---------- listas ---------- */
.list{display:flex;flex-direction:column;gap:12px}
.act{display:flex;gap:14px;align-items:flex-start;cursor:pointer;transition:transform .12s}
.act:active{transform:scale(.99)}
.act .ico{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.act h3{font-size:1.05rem}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--mut);font-size:.85rem;margin-top:4px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta svg{width:1em;height:1em}
.sale{display:flex;flex-direction:column;gap:10px}
.sale .hd{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.nchips{display:flex;gap:6px;flex-wrap:wrap}
.nchip{background:#F0EAFF;color:var(--vi-d);font-weight:800;border-radius:10px;padding:3px 9px;font-size:.9rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;margin-bottom:6px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{min-height:46px;padding:0 18px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:700;white-space:nowrap;cursor:pointer;color:var(--mut)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.checks{display:flex;flex-direction:column;gap:8px}
.chk{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:14px;background:#F8F6FF;border:1px solid var(--line);font-weight:600;cursor:pointer;text-align:left;width:100%}
.chk .dot{width:26px;height:26px;border-radius:50%;border:2px solid #CFC7EE;display:grid;place-items:center;flex:none;color:#fff}
.chk.done .dot{background:var(--tq);border-color:var(--tq)}
.chk.done{color:var(--mut)}
.chk .dot svg{width:15px;height:15px}

/* ---------- tablero de números ---------- */
.numgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px}
@media(min-width:700px){.numgrid{grid-template-columns:repeat(auto-fill,minmax(66px,1fr))}}
.num{aspect-ratio:1.05;border-radius:14px;border:2px solid transparent;font-weight:800;font-size:1rem;cursor:pointer;font-variant-numeric:tabular-nums;display:grid;place-items:center;position:relative;transition:transform .1s;padding:0;font-family:var(--f-body)}
.num:active{transform:scale(.92)}
.num.disponible{background:#E9E6F5;color:#4B4570}
.num.pagado{background:var(--tq);color:#fff}
.num.pendiente{background:#B9F0EA;color:#075C54;border:2px dashed var(--tq)}
.num.reservado{background:var(--am);color:#3A2A00}
.num.bloqueado{background:var(--co);color:#fff}
.num.sel{outline:4px solid var(--vi);outline-offset:1px}
.num.hl{box-shadow:0 0 0 4px rgba(123,79,224,.5);transform:scale(1.08);z-index:2}
.num.dim{opacity:.25}
.legend{display:flex;gap:10px 16px;flex-wrap:wrap;font-size:.82rem;font-weight:600}
.legend i{display:inline-block;width:14px;height:14px;border-radius:5px;margin-right:6px;vertical-align:-2px}
.sticky{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0}

/* ---------- hojas modales ---------- */
#sheets{position:fixed;inset:0;z-index:60;pointer-events:none}
.ov{position:fixed;inset:0;background:rgba(35,26,74,.5);display:flex;align-items:flex-end;justify-content:center;pointer-events:auto;animation:fade .2s}
.sheet{background:#fff;width:100%;max-width:640px;max-height:94vh;overflow:auto;border-radius:26px 26px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .25s cubic-bezier(.2,.8,.2,1)}
.sheet.wide{max-width:900px}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:#D9D3F0;margin:-8px auto 14px}
.sheet h2{margin-bottom:14px}
.sheet .foot{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.sheet .foot .btn{flex:1;min-width:130px}
@media(min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;max-height:90vh}}
.full{position:fixed;inset:0;z-index:55;background:var(--bg);overflow:auto;pointer-events:auto;animation:fade .2s}
.full .in{max-width:680px;margin:0 auto;padding:16px 16px 40px}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps i{flex:1;height:8px;border-radius:9px;background:#DCD5F4}
.steps i.on{background:linear-gradient(90deg,var(--vi),var(--tq))}
@keyframes fade{from{opacity:0}}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes floaty{50%{transform:translateY(-6px)}}
#toasts{position:fixed;left:0;right:0;bottom:90px;z-index:100;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 14px}
@media(min-width:900px){#toasts{bottom:30px}}
.toast{background:var(--ink);color:#fff;padding:13px 18px;border-radius:14px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);animation:up .25s;max-width:520px;pointer-events:auto}
.toast.ok{background:var(--tq-d)}.toast.err{background:var(--err)}
.fab{position:fixed;right:16px;bottom:88px;z-index:25;height:60px;padding:0 24px;border-radius:30px;border:0;color:#fff;font-weight:800;font-size:1rem;background:linear-gradient(135deg,var(--co),#FF8A5B);box-shadow:0 10px 26px rgba(255,107,91,.45);display:flex;align-items:center;gap:8px;cursor:pointer}
@media(min-width:900px){.fab{bottom:28px;right:32px}}

/* ---------- diseñador / impresión ---------- */
.studio{display:grid;gap:16px}
@media(min-width:980px){.studio{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.studio .pv{position:sticky;top:12px}}
.pvbox{background:repeating-conic-gradient(#EFEBFB 0 25%,#F8F6FF 0 50%) 0 0/20px 20px;border-radius:16px;padding:14px;display:grid;place-items:center;border:1px solid var(--line);overflow:auto}
.pvbox canvas{max-width:100%;height:auto;box-shadow:0 6px 24px rgba(35,26,74,.22);background:#fff;display:block}
.acc{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.acc+.acc{margin-top:10px}
.acc>summary{list-style:none;padding:14px 16px;font-weight:800;cursor:pointer;display:flex;align-items:center;gap:10px;min-height:54px}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary::after{content:"+";margin-left:auto;font-size:1.4rem;color:var(--vi)}
.acc[open]>summary::after{content:"–"}
.acc .body{padding:4px 16px 16px;display:flex;flex-direction:column;gap:14px}
.tpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tpl{border:2px solid var(--line);border-radius:14px;padding:8px;background:#fff;cursor:pointer;text-align:left;font-weight:700;font-size:.82rem;display:flex;flex-direction:column;gap:6px}
.tpl.on{border-color:var(--vi);box-shadow:0 0 0 3px rgba(123,79,224,.18)}
.tpl .sw{height:34px;border-radius:9px;display:flex;overflow:hidden}
.tpl .sw i{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.imgpick{display:flex;gap:10px;align-items:center}
.imgpick .th{width:56px;height:56px;border-radius:12px;background:#F0EAFF center/cover;border:1px solid var(--line);flex:none;display:grid;place-items:center;color:var(--mut)}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px;font-weight:700}
.prize{display:flex;gap:12px;align-items:center}
.prize .no{width:44px;height:44px;border-radius:50%;background:var(--co);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:800;font-size:1.2rem;flex:none}
.prize .th{width:54px;height:54px;border-radius:12px;background:#F0EAFF center/cover;flex:none}
.prog{height:10px;border-radius:99px;background:#ECE8FA;overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--tq),var(--vi));border-radius:99px;transition:width .4s}

/* ---------- sorteo ---------- */
.stage{background:linear-gradient(160deg,#241657,#3B2A8C 60%,#12857B);color:#fff;border-radius:26px;padding:22px 18px;text-align:center;position:relative;overflow:hidden}
.stage .prz{font-family:var(--f-disp);font-size:1.25rem;font-weight:800;color:var(--am);margin-bottom:6px}
.slot{font-family:var(--f-disp);font-weight:800;font-size:clamp(4rem,20vw,8.5rem);letter-spacing:.04em;line-height:1;margin:14px 0;font-variant-numeric:tabular-nums;text-shadow:0 6px 30px rgba(0,0,0,.4)}
.slot.spin{animation:flick .12s infinite}
@keyframes flick{50%{transform:translateY(-2px);filter:blur(1.5px)}}
.winname{font-size:1.5rem;font-weight:800;min-height:2em}
#celeb{position:fixed;inset:0;z-index:90;background:linear-gradient(160deg,#241657,#4B2FB3 60%,#12857B);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;gap:10px}
#celeb canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#celeb .big{font-family:var(--f-disp);font-weight:800;font-size:clamp(5rem,28vw,12rem);line-height:1;color:var(--am);animation:pop .6s both;text-shadow:0 8px 40px rgba(0,0,0,.4)}
#celeb .nm{font-size:clamp(1.6rem,6vw,2.6rem);font-weight:800;animation:pop .6s .25s both}
#celeb .pr{font-size:1.3rem;font-weight:700;opacity:.95;animation:pop .6s .1s both}
#celeb .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px;position:relative;z-index:2}
.rank{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:#fff;border:1px solid var(--line)}
.rank .o{width:40px;height:40px;border-radius:50%;background:var(--co);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}

<body>
<div id="app"><nav id="nav" aria-label="Menú principal"></nav><main id="main"></main></div>
<div id="sheets"></div><div id="toasts" aria-live="polite"></div><div id="printArea"></div>
<script>
/* ==== 01-core.js ==== */
'use strict';
/* =====================================================================
   RIFA FÁCIL — Mix Shop Digital
   01 · Núcleo: utilidades, almacenamiento, datos, reglas de negocio
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const pad2 = n => String(n).padStart(2, '0');
const today = () => { const d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); };
const MESES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
function fmtDate(iso) { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${d}/${m}/${y}`; }
function fmtDateLong(iso) { if (!iso) return ''; const [y, m, d] = String(iso).slice(0, 10).split('-'); return `${+d} de ${MESES[+m - 1]} de ${y}`; }
function fmtDT(ts) { const d = new Date(ts); return `${pad2(d.getDate())}/${pad2(d.getMonth() + 1)}/${d.getFullYear()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function daysUntil(iso) { const a = new Date(iso + 'T00:00:00'), b = new Date(today() + 'T00:00:00'); return Math.round((a - b) / 864e5); }

/* ---------- dinero ---------- */
const CURS = { 'Gs.': { sym: 'Gs.', dec: 0 }, 'US$': { sym: 'US$', dec: 2 }, 'R$': { sym: 'R$', dec: 2 }, '$ ARS': { sym: '$', dec: 2 }, '€': { sym: '€', dec: 2 } };
function fmtNum(n, dec) {
  const neg = n < 0; n = Math.abs(n);
  const [i, f] = n.toFixed(dec).split('.');
  return (neg ? '-' : '') + i.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + (f && +f ? ',' + f : '');
}
function money(n, cur) { const c = CURS[cur]; return (c ? c.sym : cur || '') + ' ' + fmtNum(+n || 0, c ? c.dec : 2); }
function waLink(phone, text) {
  let d = String(phone || '').replace(/\D/g, ''); if (!d) return '';
  if (d.startsWith('0')) d = '595' + d.slice(1); else if (d.length <= 9) d = '595' + d;
  return 'https://wa.me/' + d + (text ? '?text=' + encodeURIComponent(text) : '');
}

/* ---------- catálogos ---------- */
const TYPES = [
  { id: 'almuerzo', n: 'Almuerzo', tpl: 'almuerzo', ic: 'utensils' },
  { id: 'cena', n: 'Cena', tpl: 'cena', ic: 'moon' },
  { id: 'rifa', n: 'Rifa de premios', tpl: 'rifa', ic: 'gift' },
  { id: 'bono', n: 'Bono contribución', tpl: 'bono', ic: 'ticket' },
  { id: 'solidaria', n: 'Adhesión solidaria', tpl: 'almuerzo', ic: 'heart' },
  { id: 'evento', n: 'Evento especial', tpl: 'cena', ic: 'star' },
  { id: 'otro', n: 'Otro', tpl: 'libre', ic: 'sparkle' }
];
const typeName = id => (TYPES.find(t => t.id === id) || TYPES[6]).n;
const PAY = { pagado: 'Pagado', pendiente: 'Pendiente', reservado: 'Reservado' };

/* ---------- almacenamiento (IndexedDB → localStorage → memoria) ---------- */
const STORES = ['activities', 'sales', 'draws', 'images', 'meta'];
const DB = {
  mode: 'idb', db: null, mem: {},
  async init() {
    try {
      if (!window.indexedDB) throw new Error('sin idb');
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('rifa-facil-db', 1);
        r.onupgradeneeded = () => { const d = r.result; STORES.forEach(s => { if (!d.objectStoreNames.contains(s)) d.createObjectStore(s, { keyPath: 'id' }); }); };
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); r.onblocked = () => rej(new Error('bloqueado'));
        setTimeout(() => rej(new Error('timeout')), 4000);
      });
      await this.put('meta', { id: 'probe', t: Date.now() });
      this.mode = 'idb';
    } catch (e) {
      this.db = null;
      try { localStorage.setItem('rf_probe', '1'); localStorage.removeItem('rf_probe'); this.mode = 'ls'; }
      catch (e2) { this.mode = 'mem'; }
    }
  },
  _req(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode); const st = tx.objectStore(store); const r = fn(st);
      tx.oncomplete = () => res(r && r.result); tx.onerror = () => rej(tx.error); tx.onabort = () => rej(tx.error);
    });
  },
  async put(store, obj) {
    if (this.mode === 'idb') return this._req(store, 'readwrite', s => s.put(obj));
    if (this.mode === 'ls') { localStorage.setItem(`rf:${store}:${obj.id}`, JSON.stringify(obj)); return; }
    (this.mem[store] = this.mem[store] || {})[obj.id] = JSON.parse(JSON.stringify(obj));
  },
  async del(store, id) {
    if (this.mode === 'idb') return this._req(store, 'readwrite', s => s.delete(id));
    if (this.mode === 'ls') { localStorage.removeItem(`rf:${store}:${id}`); return; }
    if (this.mem[store]) delete this.mem[store][id];
  },
  async all(store) {
    if (this.mode === 'idb') return (await this._req(store, 'readonly', s => s.getAll())) || [];
    if (this.mode === 'ls') { const out = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(`rf:${store}:`)) { try { out.push(JSON.parse(localStorage.getItem(k))); } catch (e) { } } } return out; }
    return Object.values(this.mem[store] || {});
  },
  async clear(store) {
    if (this.mode === 'idb') return this._req(store, 'readwrite', s => s.clear());
    if (this.mode === 'ls') { const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith(`rf:${store}:`)) ks.push(k); } ks.forEach(k => localStorage.removeItem(k)); return; }
    this.mem[store] = {};
  }
};

/* ---------- estado ---------- */
const S = {
  activities: [], sales: [], draws: [], ver: 0,
  meta: { id: 'app', lastBackup: 0, changes: 0, snooze: 0, installDismissed: false, cur: null, settings: { organizer: '', phone: '', currency: 'Gs.' } }
};
const IMG = {};   // id -> dataURL
const IMGEL = {}; // id -> HTMLImageElement ya cargado
const IMGGRAY = {};
let saveErrorShown = false;
function dbFail(e) { console.error(e); if (!saveErrorShown) { saveErrorShown = true; if (window.toast) toast('No se pudo guardar en este navegador. Descargá una copia de seguridad.', 'err'); } }
function touch() { S.ver++; S.meta.changes = (S.meta.changes || 0) + 1; }
const saveAct = a => { touch(); return DB.put('activities', a).catch(dbFail); };
const saveSale = s => { touch(); return DB.put('sales', s).catch(dbFail); };
const saveDraw = d => { touch(); return DB.put('draws', d).catch(dbFail); };
const saveMeta = () => DB.put('meta', S.meta).catch(dbFail);
const getAct = id => S.activities.find(a => a.id === id);
const getDraw = a => a && a.drawId ? S.draws.find(d => d.id === a.drawId) : null;

function loadImgEl(id) {
  return new Promise(res => {
    if (IMGEL[id]) return res(IMGEL[id]);
    if (!IMG[id]) return res(null);
    const im = new Image(); im.onload = () => { IMGEL[id] = im; res(im); }; im.onerror = () => res(null); im.src = IMG[id];
  });
}
async function loadAll() {
  S.activities = await DB.all('activities');
  S.sales = await DB.all('sales');
  S.draws = await DB.all('draws');
  const metas = await DB.all('meta'); const m = metas.find(x => x.id === 'app');
  if (m) S.meta = Object.assign(S.meta, m, { settings: Object.assign({ organizer: '', phone: '', currency: 'Gs.' }, m.settings || {}) });
  const imgs = await DB.all('images'); imgs.forEach(i => { IMG[i.id] = i.data; });
  await Promise.all(Object.keys(IMG).map(loadImgEl));
  S.activities.forEach(normalizeAct);
  S.activities.sort((a, b) => b.createdAt - a.createdAt);
  S.ver++;
}
function normalizeAct(a) {
  a.prizes = a.prizes || []; a.blocked = a.blocked || []; a.audit = a.audit || [];
  a.drawRules = Object.assign({ includePending: false, includeReserved: false, repeat: false, order: 'inverso' }, a.drawRules || {});
  if (!a.design) a.design = defaultDesign(a);
  if (!a.print) a.print = defaultPrint();
  return a;
}
async function addImage(dataUrl) {
  const id = 'img_' + uid(); IMG[id] = dataUrl;
  await DB.put('images', { id, data: dataUrl }).catch(dbFail); await loadImgEl(id); return id;
}
function readImageFile(file, maxDim = 1400, keepAlpha = false) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error('No se pudo leer la imagen'));
    fr.onload = () => {
      const im = new Image();
      im.onerror = () => rej(new Error('Ese archivo no parece una imagen válida'));
      im.onload = () => {
        const sc = Math.min(1, maxDim / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(im.width * sc)); c.height = Math.max(1, Math.round(im.height * sc));
        const x = c.getContext('2d'); if (!keepAlpha) { x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); }
        x.drawImage(im, 0, 0, c.width, c.height);
        res(keepAlpha ? c.toDataURL('image/png') : c.toDataURL('image/jpeg', 0.86));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- numeración ---------- */
const numStr = (a, n) => a.pad > 0 ? String(n).padStart(a.pad, '0') : String(n);
const countOf = a => Math.max(0, a.end - a.start + 1);
function numList(a) { const out = []; for (let n = a.start; n <= a.end; n++) out.push(n); return out; }
let _idx = { k: '', m: new Map() };
function owners(a) {
  const k = a.id + ':' + S.ver;
  if (_idx.k !== k) {
    const m = new Map();
    for (const s of S.sales) if (s.actId === a.id && !s.cancelled) for (const n of s.numbers) m.set(n, s);
    _idx = { k, m };
  }
  return _idx.m;
}
function statusOf(a, n) {
  const s = owners(a).get(n);
  if (s) return s.pay;               // pagado | pendiente | reservado
  if (a.blocked.includes(n)) return 'bloqueado';
  return 'disponible';
}
function tally(a) {
  const t = { disponible: 0, pagado: 0, pendiente: 0, reservado: 0, bloqueado: 0, total: countOf(a) };
  const m = owners(a); const bl = new Set(a.blocked);
  for (let n = a.start; n <= a.end; n++) { const s = m.get(n); if (s) t[s.pay]++; else if (bl.has(n)) t.bloqueado++; else t.disponible++; }
  t.vendidos = t.pagado + t.pendiente;
  return t;
}
function actMoney(a) {
  let paid = 0, due = 0;
  for (const s of S.sales) if (s.actId === a.id && !s.cancelled) { if (s.pay === 'pagado') paid += s.total; else if (s.pay === 'pendiente') due += s.total; }
  return { paid, due };
}
function parseNumbers(text, a) {
  const out = [], errs = [];
  const t = String(text || '').replace(/\s+(al|a|hasta)\s+/gi, '-').replace(/[–—]/g, '-');
  for (const p of t.split(/[\s,;]+/).filter(Boolean)) {
    const m = p.match(/^(\d+)-(\d+)$/);
    if (m) {
      let x = +m[1], y = +m[2]; if (x > y) [x, y] = [y, x];
      if (y - x > 20000) { errs.push(`El rango ${p} es demasiado grande`); continue; }
      for (let n = x; n <= y; n++) out.push(n);
    } else if (/^\d+$/.test(p)) out.push(+p);
    else errs.push(`"${p}" no es un número válido`);
  }
  return { nums: [...new Set(out)], errs };
}
function parseFlexible(a, text) { const r = parseNumbers(text, a); return r; }
const compactRanges = (arr, a) => {
  const s = [...arr].sort((x, y) => x - y); const out = []; let i = 0;
  while (i < s.length) { let j = i; while (j + 1 < s.length && s[j + 1] === s[j] + 1) j++; out.push(j - i >= 2 ? `${numStr(a, s[i])}–${numStr(a, s[j])}` : s.slice(i, j + 1).map(n => numStr(a, n)).join(', ')); i = j + 1; }
  return out.join(', ');
};

/* ---------- ventas ---------- */
function validateSale(a, d, ignoreId) {
  const errs = [];
  if (!d.buyer || d.buyer.trim().length < 2) errs.push('Escribí el nombre y apellido del comprador.');
  if (d.phone && d.phone.replace(/\D/g, '').length < 6) errs.push('El teléfono parece incompleto (mínimo 6 dígitos). Dejalo vacío si no lo tenés.');
  if (!d.numbers || !d.numbers.length) errs.push('Elegí al menos un número.');
  const m = owners(a);
  const bad = [];
  for (const n of d.numbers || []) {
    if (!Number.isInteger(n) || n < a.start || n > a.end) { bad.push(`El número ${n} no existe en esta actividad (va del ${numStr(a, a.start)} al ${numStr(a, a.end)}).`); continue; }
    const o = m.get(n);
    if (o && o.id !== ignoreId) bad.push(`El número ${numStr(a, n)} ya está asignado a ${o.buyer}.`);
    else if (a.blocked.includes(n)) bad.push(`El número ${numStr(a, n)} está bloqueado. Desbloquealo desde el tablero.`);
  }
  if (new Set(d.numbers).size !== (d.numbers || []).length) bad.push('Hay números repetidos en la lista.');
  if (!PAY[d.pay]) errs.push('Elegí el estado de pago.');
  return errs.concat(bad);
}
const drawLocked = a => { const d = getDraw(a); return !!(d && d.status === 'finalizado'); };
function logAudit(a, type, detail) { a.audit.push({ at: Date.now(), type, detail }); }
async function createSale(a, d) {
  const errs = validateSale(a, d); if (errs.length) return { errs };
  const nums = [...d.numbers].sort((x, y) => x - y);
  const s = { id: uid(), actId: a.id, buyer: d.buyer.trim(), phone: (d.phone || '').trim(), numbers: nums, date: d.date || today(), createdAt: Date.now(), qty: nums.length, total: nums.length * a.price, pay: d.pay, notes: (d.notes || '').trim(), cancelled: false, history: [{ at: Date.now(), txt: 'Venta registrada' }] };
  S.sales.push(s); await saveSale(s);
  logAudit(a, 'venta', `Venta a ${s.buyer}: ${compactRanges(nums, a)} (${PAY[s.pay]})`); await saveAct(a);
  return { sale: s };
}
async function updateSale(a, s, d) {
  const errs = validateSale(a, d, s.id); if (errs.length) return { errs };
  const nums = [...d.numbers].sort((x, y) => x - y);
  const before = `${s.buyer}|${s.phone}|${s.numbers.join(',')}|${s.pay}|${s.notes}`;
  Object.assign(s, { buyer: d.buyer.trim(), phone: (d.phone || '').trim(), numbers: nums, date: d.date || s.date, qty: nums.length, total: nums.length * a.price, pay: d.pay, notes: (d.notes || '').trim() });
  if (before !== `${s.buyer}|${s.phone}|${s.numbers.join(',')}|${s.pay}|${s.notes}`) {
    s.history.push({ at: Date.now(), txt: 'Datos editados' });
    if (drawLocked(a)) logAudit(a, 'modificación posterior al sorteo', `Se editó la venta de ${s.buyer} (${compactRanges(nums, a)}) después del sorteo`);
    else logAudit(a, 'venta editada', `Venta de ${s.buyer}: ${compactRanges(nums, a)} (${PAY[s.pay]})`);
  }
  await saveSale(s); await saveAct(a); return { sale: s };
}
async function setPay(a, s, pay) {
  if (s.pay === pay) return;
  s.history.push({ at: Date.now(), txt: `Pago: ${PAY[s.pay]} → ${PAY[pay]}` });
  logAudit(a, drawLocked(a) ? 'modificación posterior al sorteo' : 'pago', `${s.buyer}: ${PAY[s.pay]} → ${PAY[pay]} (${compactRanges(s.numbers, a)})`);
  s.pay = pay; await saveSale(s); await saveAct(a);
}
async function cancelSale(a, s, mode, reason) {
  s.cancelled = true; s.cancelledAt = Date.now(); s.cancelReason = reason || ''; s.history.push({ at: Date.now(), txt: 'Venta cancelada' + (mode === 'bloquear' ? ' (números bloqueados)' : ' (números liberados)') });
  if (mode === 'bloquear') for (const n of s.numbers) if (!a.blocked.includes(n)) a.blocked.push(n);
  logAudit(a, drawLocked(a) ? 'modificación posterior al sorteo' : 'venta cancelada', `Se canceló la venta de ${s.buyer}: ${compactRanges(s.numbers, a)}${reason ? ' · ' + reason : ''}`);
  await saveSale(s); await saveAct(a);
}
async function toggleBlock(a, n) {
  const i = a.blocked.indexOf(n);
  if (i >= 0) { a.blocked.splice(i, 1); logAudit(a, 'bloqueo', `Número ${numStr(a, n)} desbloqueado`); }
  else { if (owners(a).get(n)) return false; a.blocked.push(n); logAudit(a, 'bloqueo', `Número ${numStr(a, n)} bloqueado`); }
  await saveAct(a); return true;
}

/* ---------- actividades ---------- */
function newActivity(p) {
  return Object.assign({
    id: uid(), name: '', type: 'almuerzo', organizer: S.meta.settings.organizer || '', institution: '', beneficiary: '', description: '',
    eventDate: '', drawDate: '', price: 0, currency: S.meta.settings.currency || 'Gs.', start: 1, end: 100, pad: 3, numPreset: '100',
    place: '', phone: S.meta.settings.phone || '', extra: '', status: 'borrador', createdAt: Date.now(),
    prizes: [], blocked: [], design: null, print: null, drawRules: { includePending: false, includeReserved: false, repeat: false, order: 'inverso' },
    audit: [], drawId: null, finishedAt: null
  }, p || {});
}
function actProblems(a) {
  const p = [];
  if (!a.name.trim()) p.push('Nombre de la actividad');
  if (!(a.price > 0)) p.push('Precio');
  if (!(a.end >= a.start)) p.push('Numeración');
  return p;
}
async function deleteActivity(a) {
  const sales = S.sales.filter(s => s.actId === a.id); const draws = S.draws.filter(d => d.actId === a.id);
  for (const s of sales) await DB.del('sales', s.id).catch(dbFail);
  for (const d of draws) await DB.del('draws', d.id).catch(dbFail);
  await DB.del('activities', a.id).catch(dbFail);
  S.sales = S.sales.filter(s => s.actId !== a.id); S.draws = S.draws.filter(d => d.actId !== a.id); S.activities = S.activities.filter(x => x.id !== a.id);
  touch(); if (S.meta.cur === a.id) S.meta.cur = null; await saveMeta();
}

/* ---------- sorteo ---------- */
function randInt(n) {
  if (n <= 1) return 0;
  const c = (window.crypto || window.msCrypto); const lim = Math.floor(0x100000000 / n) * n; const buf = new Uint32Array(1);
  for (let i = 0; i < 100; i++) { c.getRandomValues(buf); if (buf[0] < lim) return buf[0] % n; }
  return Math.floor(Math.random() * n);
}
function eligibleOf(a, rules) {
  const out = [];
  for (const s of S.sales) {
    if (s.actId !== a.id || s.cancelled) continue;
    const ok = s.pay === 'pagado' || (s.pay === 'pendiente' && rules.includePending) || (s.pay === 'reservado' && rules.includeReserved);
    if (ok) for (const n of s.numbers) out.push({ n, buyer: s.buyer, phone: s.phone, pay: s.pay, saleId: s.id });
  }
  return out.sort((x, y) => x.n - y.n);
}
function prizesSorted(a) { return [...a.prizes].sort((x, y) => x.order - y.order); }
function drawSequence(a, rules) { const p = prizesSorted(a); return rules.order === 'directo' ? p : p.reverse(); }
async function startDraw(a, rules) {
  const eligible = eligibleOf(a, rules);
  const d = { id: uid(), actId: a.id, startedAt: Date.now(), rules: { ...rules }, eligible, results: [], status: 'en curso', finishedAt: null, prizesSnapshot: prizesSorted(a).map(p => ({ id: p.id, name: p.name, order: p.order })) };
  S.draws.push(d); a.drawId = d.id; a.drawRules = { ...rules };
  logAudit(a, 'sorteo iniciado', `Participantes elegibles: ${eligible.length}. Premios: ${a.prizes.length}. Reglas: ${rules.includePending ? 'incluye pendientes; ' : ''}${rules.includeReserved ? 'incluye reservados; ' : ''}${rules.repeat ? 'un número puede ganar varios premios' : 'un premio por número'}`);
  await saveDraw(d); await saveAct(a); return d;
}
async function drawOne(a, d, prize) {
  const won = new Set(d.results.map(r => r.number));
  const pool = d.rules.repeat ? d.eligible : d.eligible.filter(e => !won.has(e.n));

/* ---------- confeti ---------- */
class Confetti {
  constructor(canvas) { this.c = canvas; this.x = canvas.getContext('2d'); this.p = []; this.run = false; }
  burst(n = 160) {
    const W = this.c.width, H = this.c.height, cols = ['#FFC531', '#FF6B5B', '#12B5A6', '#7B4FE0', '#2B6BFF', '#fff'];
    for (let i = 0; i < n; i++) this.p.push({ x: W / 2 + (Math.random() - 0.5) * W * 0.3, y: H * 0.4, vx: (Math.random() - 0.5) * 16, vy: -Math.random() * 18 - 4, r: Math.random() * 6.28, vr: (Math.random() - 0.5) * 0.4, s: 6 + Math.random() * 8, c: cols[i % cols.length], life: 0 });
    if (!this.run) { this.run = true; this.loop(); }
  }
  loop() {
    const W = this.c.width, H = this.c.height; this.x.clearRect(0, 0, W, H);
    this.p.forEach(q => { q.vy += 0.42; q.vx *= 0.995; q.x += q.vx; q.y += q.vy; q.r += q.vr; q.life++; this.x.save(); this.x.translate(q.x, q.y); this.x.rotate(q.r); this.x.fillStyle = q.c; this.x.fillRect(-q.s / 2, -q.s / 4, q.s, q.s / 2); this.x.restore(); });
    this.p = this.p.filter(q => q.y < H + 30 && q.life < 260);
    if (this.p.length) requestAnimationFrame(() => this.loop()); else { this.run = false; this.x.clearRect(0, 0, W, H); }
  }
}

A.drawGo = async () => {
  if (drawBusy) return; const a = cur(), d = getDraw(a); drawBusy = true; $('#drawgo').disabled = true; if ($('#drawall')) $('#drawall').disabled = true;
  try { const r = await drawStep(a, d, 3400); if (r) await celebrate(a, d, r); } finally { drawBusy = false; }
  render();
};
A.drawAll = async () => {
  if (drawBusy) return; const a = cur(), d = getDraw(a); drawBusy = true; $('#drawgo').disabled = true; $('#drawall').disabled = true; let last = null;
  try { while (nextPrize(a, d)) { last = await drawStep(a, d, 1800); if (!last) break; if (nextPrize(a, d)) await sleep(1400); } if (last) await celebrate(a, d, last, true); } finally { drawBusy = false; }
  render();
};

    document.body.appendChild(el); const cv = el.querySelector('canvas'); cv.width = innerWidth; cv.height = innerHeight; const cf = new Confetti(cv); if (!reduceMotion()) { cf.burst(200); setTimeout(() => cf.burst(120), 700); }
    el.querySelector('#ce-ok').onclick = () => { el.remove(); res(); };
  });
}

INP.hq = el => { UI.histQ = el.value; const q = UI.histQ.trim().toLowerCase(); $('#hlist').innerHTML = histList(S.activities.filter(a => !q || a.name.toLowerCase().includes(q) || (a.beneficiary || '').toLowerCase().includes(q))); };

function afterSettings() { if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(e => { const el = $('#st-q'); if (el && e.usage != null) el.textContent = `Ocupado: ${(e.usage / 1048576).toFixed(1)} MB`; }).catch(() => { }); }
INP.set = el => { S.meta.settings[el.dataset.k] = el.value; saveMeta(); };
A.backupAll = () => { if (!S.activities.length) return toast('Todavía no hay nada para guardar.', 'err'); saveBlob(new Blob([JSON.stringify(buildBackup())], { type: 'application/json' }), `rifa-facil-copia-${today()}.json`); S.meta.lastBackup = Date.now(); S.meta.changes = 0; saveMeta(); toast('Copia descargada. Guardala en un lugar seguro (Drive, pendrive…)', 'ok'); render(); };
INP.import = async el => {
  const f = el.files[0]; el.value = ''; if (!f) return;
  try {
    const obj = JSON.parse(await f.text()); if (!obj || obj.app !== 'rifa-facil') throw new Error('Este archivo no es una copia de seguridad de RIFA FÁCIL.');

    const r = await importBackup(obj); toast(`Importado: ${r.activities} actividades, ${r.sales} ventas${r.renamed ? ` (${r.renamed} como copia)` : ''}`, 'ok'); render();
  } catch (e) { toast(e instanceof SyntaxError ? 'El archivo está dañado o no es una copia válida.' : e.message, 'err'); }

/* ---------- aplicación instalable ---------- */
function appIcon(size) {
  const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'), u = size / 100;
  const g = x.createLinearGradient(0, 0, size, size); g.addColorStop(0, '#12B5A6'); g.addColorStop(1, '#7B4FE0'); rr(x, 0, 0, size, size, 22 * u); x.fillStyle = g; x.fill();
  x.save(); x.translate(50 * u, 50 * u); x.rotate(-0.2); x.fillStyle = '#fff'; rr(x, -32 * u, -20 * u, 64 * u, 40 * u, 6 * u); x.fill(); x.fillStyle = '#7B4FE0'; x.beginPath(); x.arc(-32 * u, 0, 7 * u, 0, 7); x.arc(32 * u, 0, 7 * u, 0, 7); x.fill();
  x.strokeStyle = '#FFC531'; x.lineWidth = 3 * u; x.setLineDash([4 * u, 4 * u]); x.beginPath(); x.moveTo(10 * u, -16 * u); x.lineTo(10 * u, 16 * u); x.stroke(); x.setLineDash([]);
  x.fillStyle = '#7B4FE0'; x.font = `800 ${24 * u}px Impact, "Arial Black", sans-serif`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('RF', -11 * u, 2 * u); x.restore(); return c.toDataURL('image/png');
}
function setupPwa() {
  try {
    const i192 = appIcon(192), i512 = appIcon(512); const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = i192; document.head.appendChild(fav);
    const ap = document.createElement('link'); ap.rel = 'apple-touch-icon'; ap.href = i192; document.head.appendChild(ap);
    if (!/^https?:/.test(location.protocol)) return;
    const man = { name: 'RIFA FÁCIL', short_name: 'RIFA FÁCIL', description: 'Creá, personalizá, vendé y sorteá. Mix Shop Digital', start_url: location.href.split('#')[0], scope: location.href.split('#')[0].replace(/[^/]*$/, ''), display: 'standalone', background_color: '#F5F3FF', theme_color: '#7B4FE0', lang: 'es', icons: [{ src: i192, sizes: '192x192', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png' }, { src: i512, sizes: '512x512', type: 'image/png', purpose: 'maskable' }] };
    const l = document.createElement('link'); l.rel = 'manifest'; l.href = URL.createObjectURL(new Blob([JSON.stringify(man)], { type: 'application/manifest+json' })); document.head.appendChild(l);

}

window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (['home', 'acts', 'sales', 'numbers', 'draw', 'settings', 'history'].includes(h) && h !== UI.route) { UI.route = h; render(); } });

})();
