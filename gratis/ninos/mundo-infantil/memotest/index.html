/* ===== Paleta Mundo Infantil ===== */
:root{
  --ink:#4A2F27; --soft:#7A6C99; --violet:#8727E2; --pink:#E0457B; --blue:#0038A8;
  --red:#D52B1E; --green:#2E9E68; --yellow:#F2A100; --card-back:#8727E2;
  --font:"FredokaMI","Fredoka One","Fredoka","Trebuchet MS","Segoe UI Rounded",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--ink);background:linear-gradient(180deg,#BFE6FF 0%,#EAF7FF 55%,#CFEFC0 100%);overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
/* nubes y colinas decorativas */
body::before{content:"";position:fixed;left:-10%;right:-10%;bottom:-18vh;height:40vh;background:#8FDB62;border-radius:50% 50% 0 0;z-index:0}
body::after{content:"";position:fixed;left:30%;right:-20%;bottom:-24vh;height:38vh;background:#6CCB52;border-radius:50% 50% 0 0;z-index:0}
.cloud{position:fixed;background:#fff;border-radius:60px;opacity:.9;z-index:0;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:50%;height:140%;left:12%;top:-60%}.cloud::after{width:38%;height:110%;right:14%;top:-40%}
.c1{width:120px;height:36px;top:8%;left:-150px}.c2{width:90px;height:28px;top:20%;left:-120px;animation-duration:55s;animation-delay:-20s}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}

.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:1;padding:16px;text-align:center}
.screen.active{display:flex;animation:pop .45s ease}
@keyframes pop{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:none}}

.brand{display:inline-block;background:#fff;color:var(--violet);padding:6px 18px;border-radius:999px;font-size:clamp(13px,3.4vw,18px);box-shadow:0 3px 0 #D9CCF5}
h1{margin:14px 0 4px;line-height:1.02;font-weight:normal;font-size:clamp(38px,11vw,84px);color:var(--red);
  -webkit-text-stroke:0;text-shadow:0 4px 0 #fff,0 -2px 0 #fff,3px 0 0 #fff,-3px 0 0 #fff,0 7px 0 rgba(135,39,226,.25)}
h1 span{color:var(--blue);display:block}
.lead{font-size:clamp(16px,4vw,24px);color:var(--ink);background:rgba(255,255,255,.85);padding:6px 18px;border-radius:999px;margin:6px 0 18px}
.hero{display:flex;gap:clamp(4px,2vw,16px);margin:6px 0 14px;justify-content:center}
.hero svg{width:clamp(56px,16vw,110px);height:auto;filter:drop-shadow(0 5px 0 rgba(90,58,46,.15));animation:bob 2.4s ease-in-out infinite}
.hero svg:nth-child(2){animation-delay:.3s}.hero svg:nth-child(3){animation-delay:.6s}.hero svg:nth-child(4){animation-delay:.9s}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}

/* ===== Botones ===== */
.btn{font-family:var(--font);font-size:clamp(20px,5vw,30px);border:0;border-radius:999px;padding:.55em 1.6em;color:#fff;background:var(--green);
  box-shadow:0 6px 0 #1B7549;cursor:pointer;transition:transform .12s,box-shadow .12s;touch-action:manipulation}
.btn:hover{transform:translateY(-2px)}.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #1B7549}
.btn:focus-visible,.card:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.btn.big{font-size:clamp(28px,7vw,44px);background:var(--pink);box-shadow:0 7px 0 #A82C5A;animation:beat 1.6s ease-in-out infinite}
.btn.big:active{box-shadow:0 2px 0 #A82C5A}
@keyframes beat{50%{transform:scale(1.05)}}
.btn.small{font-size:clamp(14px,3.6vw,18px);padding:.45em 1.1em;box-shadow:0 4px 0 #1B7549}
.btn.small.alt{background:var(--violet);box-shadow:0 4px 0 #5B15A0}
.levels{display:flex;flex-direction:column;gap:14px;width:min(360px,92vw);margin-top:6px}
.level{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;font-size:clamp(20px,5.2vw,28px);padding:.5em 1.1em}
.level small{font-size:.58em;opacity:.95}
.level[data-n="6"]{background:var(--green);box-shadow:0 6px 0 #1B7549}
.level[data-n="8"]{background:var(--yellow);box-shadow:0 6px 0 #B87600}
.level[data-n="12"]{background:var(--red);box-shadow:0 6px 0 #8E1A12}
h2{font-weight:normal;font-size:clamp(28px,7vw,46px);margin:0 0 12px;color:var(--violet);text-shadow:0 3px 0 #fff}

/* ===== Juego ===== */
#game{justify-content:flex-start;padding-top:10px}
.hud{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;width:100%;max-width:900px}
.chip{background:#fff;border-radius:999px;padding:5px 14px;font-size:clamp(14px,3.8vw,20px);box-shadow:0 3px 0 #D9CCF5;white-space:nowrap}
.chip b{font-weight:normal;color:var(--pink)}
.board-wrap{flex:1;width:100%;min-height:0;display:flex;align-items:center;justify-content:center;margin:8px 0}
.board{display:grid;gap:var(--gap,10px);justify-content:center;align-content:center}
.card{position:relative;width:var(--size);height:var(--size);padding:0;border:0;background:none;cursor:pointer;perspective:700px;touch-action:manipulation}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,1.3,.5,1)}
.card.flipped .inner,.card.matched .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:16%;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  border:4px solid #5A3A2E;box-shadow:0 5px 0 rgba(90,58,46,.35)}
.back{background:radial-gradient(circle at 30% 25%,#B77BFF,var(--card-back));color:#fff}
.back::after{content:"★";font-size:calc(var(--size)*.42);color:#FFE066;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.front{transform:rotateY(180deg);background:#fff}
.front svg{width:86%;height:86%}
.card:hover:not(.flipped):not(.matched) .inner{transform:translateY(-4px)}
.card.matched .front{background:#FFF8D6;border-color:var(--green);animation:match .6s ease}
.card.shake .inner{animation:shake .4s}
@keyframes match{0%{transform:rotateY(180deg) scale(1)}40%{transform:rotateY(180deg) scale(1.15)}100%{transform:rotateY(180deg) scale(1)}}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-5px)}75%{transform:rotateY(180deg) translateX(5px)}}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;padding-bottom:6px}

/* ===== Victoria ===== */
#win{background:rgba(255,255,255,.55);backdrop-filter:blur(3px)}
.win-box{background:#fff;border:5px solid var(--yellow);border-radius:28px;padding:20px clamp(16px,5vw,40px);box-shadow:0 8px 0 rgba(0,0,0,.12);max-width:92vw}
.win-box h2{color:var(--pink)}
.stars{font-size:clamp(34px,10vw,56px);color:#FFC400;letter-spacing:6px;text-shadow:0 3px 0 #B87600}
.stars .off{color:#E2D9F2;text-shadow:none}
.win-stats{display:flex;gap:10px;justify-content:center;margin:10px 0 16px;flex-wrap:wrap}
.win-box .actions{margin-top:8px}
.confetti{position:fixed;top:-20px;width:12px;height:16px;z-index:5;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

.sign{position:fixed;left:0;right:0;bottom:6px;text-align:center;font-size:12px;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.25);z-index:2;pointer-events:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01ms!important}}
@media (max-height:520px){.hero{display:none}h1{margin-top:4px}.lead{margin-bottom:8px}}
</style>
</head>

<div class="cloud c1"></div><div class="cloud c2"></div>

<!-- ===== Pantalla 1: inicio ===== -->
<section id="start" class="screen active" aria-labelledby="t">
  <span class="brand">Mundo Infantil – Mix Shop Digital</span>
  <h1 id="t">Memotest Infantil<span>¡Encontrá las Parejas!</span></h1>
  <div class="hero" id="hero" aria-hidden="true"></div>
  <p class="lead">Un mundo para aprender, jugar y crear</p>
  <button class="btn big" id="btnPlay" type="button">¡Jugar!</button>
</section>

<!-- ===== Pantalla 2: dificultad ===== -->
<section id="levels" class="screen" aria-labelledby="lv">
  <h2 id="lv">Elegí la dificultad</h2>
  <div class="levels">
    <button class="btn level" data-n="6" type="button">Fácil <small>6 parejas</small></button>
    <button class="btn level" data-n="8" type="button">Intermedio <small>8 parejas</small></button>
    <button class="btn level" data-n="12" type="button">Difícil <small>12 parejas</small></button>
  </div>
  <p style="margin-top:18px"><button class="btn small alt" id="btnBackStart" type="button">Volver</button></p>
</section>

<!-- ===== Pantalla 3: juego ===== -->
<section id="game" class="screen" aria-label="Juego">
  <div class="hud">
    <span class="chip">Movimientos: <b id="moves">0</b></span>
    <span class="chip">Tiempo: <b id="time">0:00</b></span>
    <span class="chip">Parejas: <b id="pairs">0</b> de <b id="total">0</b></span>
  </div>
  <div class="board-wrap" id="wrap"><div class="board" id="board" role="group" aria-label="Tarjetas"></div></div>
  <div class="actions">
    <button class="btn small" id="btnAgain" type="button">Reiniciar</button>
    <button class="btn small alt" id="btnLevel" type="button">Cambiar dificultad</button>
  </div>
  <div class="sr" id="live" aria-live="polite"></div>
</section>

<!-- ===== Pantalla 4: victoria ===== -->
<section id="win" class="screen" role="dialog" aria-modal="true" aria-labelledby="wt">
  <div class="win-box">
    <h2 id="wt">¡Felicitaciones!</h2>
    <div class="stars" id="stars" aria-hidden="true"></div>
    <p class="lead" style="background:none;margin:4px 0">¡Encontraste todas las parejas!</p>
    <div class="win-stats">
      <span class="chip">Movimientos: <b id="wMoves">0</b></span>
      <span class="chip">Tiempo: <b id="wTime">0:00</b></span>
    </div>
    <div class="actions">
      <button class="btn small" id="btnWinAgain" type="button">Jugar de nuevo</button>
      <button class="btn small alt" id="btnWinLevel" type="button">Cambiar dificultad</button>
    </div>
  </div>
</section>

<div class="sign">Mix Shop Digital | Mundo Infantil</div>

<script>
"use strict";
/* =====================================================================
   Memotest Infantil – Mundo Infantil · Mix Shop Digital
   JavaScript puro, sin librerías ni conexión a internet.
   Estructura: 1) ilustraciones  2) estado  3) pantallas  4) tablero
               5) lógica de pares  6) cronómetro  7) victoria  8) eventos
   ===================================================================== */

/* ---------- 1) Ilustraciones de animales (SVG en línea, estilo kawaii) ---------- */
var S = 'stroke="#5A3A2E" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"';
function eyes(y, dx, r) { dx = dx || 14; r = r || 4.2;
  return '<circle cx="' + (50 - dx) + '" cy="' + y + '" r="' + r + '" fill="#2B1B17"/><circle cx="' + (50 + dx) + '" cy="' + y + '" r="' + r + '" fill="#2B1B17"/>' +
         '<circle cx="' + (50 - dx + 1.4) + '" cy="' + (y - 1.4) + '" r="1.4" fill="#fff"/><circle cx="' + (50 + dx + 1.4) + '" cy="' + (y - 1.4) + '" r="1.4" fill="#fff"/>'; }
function cheeks(y) { return '<ellipse cx="29" cy="' + y + '" rx="5.5" ry="3.6" fill="#FF9FB5" opacity=".75"/><ellipse cx="71" cy="' + y + '" rx="5.5" ry="3.6" fill="#FF9FB5" opacity=".75"/>'; }
function mouth(y) { return '<path d="M44 ' + y + ' Q50 ' + (y + 6) + ' 56 ' + y + '" fill="none" ' + S + '/>'; }
function nose(y, col) { return '<ellipse cx="50" cy="' + y + '" rx="5" ry="3.6" fill="' + (col || '#2B1B17') + '" ' + S + ' stroke-width="2"/>'; }

var ANIMALS = [
  { id: 'perro', nombre: 'Perro', svg:
    '<ellipse cx="20" cy="46" rx="11" ry="22" fill="#8B5A2B" ' + S + ' transform="rotate(12 20 46)"/><ellipse cx="80" cy="46" rx="11" ry="22" fill="#8B5A2B" ' + S + ' transform="rotate(-12 80 46)"/>' +
    '<circle cx="50" cy="52" r="32" fill="#E0A458" ' + S + '/><ellipse cx="50" cy="63" rx="17" ry="13" fill="#FFF1D6" ' + S + ' stroke-width="2.4"/>' + eyes(46) + nose(58) + mouth(66) + cheeks(60) },
  { id: 'gato', nombre: 'Gato', svg:
    '<path d="M18 40 L22 10 L44 26 Z" fill="#F2A65A" ' + S + '/><path d="M82 40 L78 10 L56 26 Z" fill="#F2A65A" ' + S + '/><path d="M24 30 L26 18 L36 26Z" fill="#FF9FB5"/><path d="M76 30 L74 18 L64 26Z" fill="#FF9FB5"/>' +
    '<circle cx="50" cy="55" r="33" fill="#F2A65A" ' + S + '/><path d="M42 24 L42 34 M50 22 L50 33 M58 24 L58 34" ' + S + ' stroke-width="2.4" fill="none"/>' + eyes(52, 14, 4.4) + nose(60, '#FF7FA0') + mouth(65) +
    '<path d="M10 58 L28 61 M10 68 L28 65 M90 58 L72 61 M90 68 L72 65" ' + S + ' stroke-width="2" fill="none"/>' + cheeks(64) },
  { id: 'conejo', nombre: 'Conejo', svg:
    '<ellipse cx="36" cy="22" rx="9" ry="22" fill="#fff" ' + S + '/><ellipse cx="64" cy="22" rx="9" ry="22" fill="#fff" ' + S + '/><ellipse cx="36" cy="24" rx="4" ry="15" fill="#FFB7CB"/><ellipse cx="64" cy="24" rx="4" ry="15" fill="#FFB7CB"/>' +
    '<circle cx="50" cy="62" r="31" fill="#fff" ' + S + '/>' + eyes(58) + nose(66, '#FF7FA0') + '<path d="M50 70 L50 74 M44 76 Q50 80 50 74 Q50 80 56 76" fill="none" ' + S + ' stroke-width="2.2"/><rect x="46" y="76" width="8" height="8" rx="2" fill="#fff" ' + S + ' stroke-width="2"/>' + cheeks(70) },
  { id: 'oso', nombre: 'Oso', svg:
    '<circle cx="23" cy="28" r="13" fill="#9A6B3B" ' + S + '/><circle cx="77" cy="28" r="13" fill="#9A6B3B" ' + S + '/><circle cx="23" cy="28" r="6" fill="#E8B685"/><circle cx="77" cy="28" r="6" fill="#E8B685"/>' +
    '<circle cx="50" cy="54" r="34" fill="#9A6B3B" ' + S + '/><ellipse cx="50" cy="65" rx="16" ry="12.5" fill="#E8B685" ' + S + ' stroke-width="2.4"/>' + eyes(48) + nose(61) + mouth(68) + cheeks(60) },
  { id: 'leon', nombre: 'León', svg:
    '<circle cx="50" cy="52" r="42" fill="#E07A1F" ' + S + '/><circle cx="24" cy="24" r="11" fill="#F2B84B" ' + S + '/><circle cx="76" cy="24" r="11" fill="#F2B84B" ' + S + '/>' +
    '<circle cx="50" cy="54" r="29" fill="#F6C85F" ' + S + '/><ellipse cx="50" cy="64" rx="13" ry="10" fill="#FFF1D6" ' + S + ' stroke-width="2.2"/>' + eyes(50, 12) + nose(60, '#8E4A22') + mouth(66) + cheeks(62) },
  { id: 'rana', nombre: 'Rana', svg:
    '<circle cx="30" cy="26" r="15" fill="#6CCB52" ' + S + '/><circle cx="70" cy="26" r="15" fill="#6CCB52" ' + S + '/><circle cx="30" cy="26" r="8" fill="#fff" ' + S + ' stroke-width="2"/><circle cx="70" cy="26" r="8" fill="#fff" ' + S + ' stroke-width="2"/><circle cx="31" cy="27" r="4" fill="#2B1B17"/><circle cx="69" cy="27" r="4" fill="#2B1B17"/>' +
    '<ellipse cx="50" cy="62" rx="40" ry="30" fill="#6CCB52" ' + S + '/><path d="M26 64 Q50 86 74 64" fill="none" ' + S + '/><circle cx="43" cy="50" r="1.8" fill="#2B1B17"/><circle cx="57" cy="50" r="1.8" fill="#2B1B17"/>' + cheeks(64) },
  { id: 'cerdito', nombre: 'Cerdito', svg:
    '<path d="M18 36 L20 10 L42 24 Z" fill="#FF9FB5" ' + S + '/><path d="M82 36 L80 10 L58 24 Z" fill="#FF9FB5" ' + S + '/>' +
    '<circle cx="50" cy="56" r="34" fill="#FFB7CB" ' + S + '/><ellipse cx="50" cy="64" rx="16" ry="12" fill="#FF8FAE" ' + S + ' stroke-width="2.6"/><ellipse cx="44" cy="64" rx="2.8" ry="4" fill="#8E3A55"/><ellipse cx="56" cy="64" rx="2.8" ry="4" fill="#8E3A55"/>' + eyes(46) + cheeks(56) },
  { id: 'pollito', nombre: 'Pollito', svg:
    '<path d="M44 20 Q42 8 48 10 Q50 4 54 10 Q60 8 56 20" fill="#FFD84D" ' + S + '/><circle cx="50" cy="54" r="36" fill="#FFD84D" ' + S + '/>' +
    '<path d="M42 58 L58 58 L50 69 Z" fill="#FF8A1F" ' + S + ' stroke-width="2.4"/>' + eyes(48, 15) + cheeks(60) + '<path d="M14 56 Q8 66 18 70" fill="#FFD84D" ' + S + '/><path d="M86 56 Q92 66 82 70" fill="#FFD84D" ' + S + '/>' },
  { id: 'mono', nombre: 'Mono', svg:
    '<circle cx="14" cy="52" r="12" fill="#8B5A2B" ' + S + '/><circle cx="86" cy="52" r="12" fill="#8B5A2B" ' + S + '/><circle cx="14" cy="52" r="6" fill="#F4C9A0"/><circle cx="86" cy="52" r="6" fill="#F4C9A0"/>' +
    '<circle cx="50" cy="50" r="35" fill="#8B5A2B" ' + S + '/><path d="M26 44 Q36 34 50 44 Q64 34 74 44 Q82 64 64 78 Q50 86 36 78 Q18 64 26 44Z" fill="#F4C9A0" ' + S + ' stroke-width="2.4"/>' +
    eyes(52, 11) + '<ellipse cx="45" cy="64" rx="1.8" ry="2.4" fill="#2B1B17"/><ellipse cx="55" cy="64" rx="1.8" ry="2.4" fill="#2B1B17"/>' + mouth(70) },
  { id: 'elefante', nombre: 'Elefante', svg:
    '<ellipse cx="17" cy="46" rx="15" ry="22" fill="#9FB0C8" ' + S + '/><ellipse cx="83" cy="46" rx="15" ry="22" fill="#9FB0C8" ' + S + '/><ellipse cx="17" cy="46" rx="8" ry="14" fill="#FFB7CB"/><ellipse cx="83" cy="46" rx="8" ry="14" fill="#FFB7CB"/>' +
    '<circle cx="50" cy="46" r="30" fill="#B9C6DA" ' + S + '/><path d="M42 58 Q42 84 52 88 Q60 90 60 82 Q60 78 55 78 Q52 78 52 72 L58 58 Z" fill="#B9C6DA" ' + S + '/>' + eyes(42, 12) + cheeks(56) },
  { id: 'zorro', nombre: 'Zorro', svg:
    '<path d="M14 42 L20 8 L44 26 Z" fill="#F07A2A" ' + S + '/><path d="M86 42 L80 8 L56 26 Z" fill="#F07A2A" ' + S + '/><path d="M22 28 L22 18 L34 26Z" fill="#2B1B17"/><path d="M78 28 L78 18 L66 26Z" fill="#2B1B17"/>' +
    '<path d="M12 52 Q14 30 50 30 Q86 30 88 52 Q86 78 50 90 Q14 78 12 52Z" fill="#F07A2A" ' + S + '/><path d="M12 54 Q30 62 50 90 Q70 62 88 54 Q70 70 50 72 Q30 70 12 54Z" fill="#fff" ' + S + ' stroke-width="2.4"/>' + eyes(50, 15) + nose(78) },
  { id: 'tortuga', nombre: 'Tortuga', svg:
    '<ellipse cx="26" cy="78" rx="9" ry="7" fill="#9AD66A" ' + S + '/><ellipse cx="74" cy="78" rx="9" ry="7" fill="#9AD66A" ' + S + '/>' +
    '<circle cx="50" cy="30" r="17" fill="#9AD66A" ' + S + '/>' + eyes(28, 7, 3.4) + '<path d="M45 36 Q50 40 55 36" fill="none" ' + S + ' stroke-width="2.2"/>' +
    '<path d="M12 74 Q12 44 50 44 Q88 44 88 74 Z" fill="#4FAE55" ' + S + '/><path d="M50 44 L50 74 M30 50 L34 74 M70 50 L66 74" ' + S + ' stroke-width="2.2" fill="none"/><path d="M30 58 Q50 52 70 58" ' + S + ' stroke-width="2.2" fill="none"/>' }
];
/* Cada animal se dibuja dentro de un <svg> con la misma caja (100x100). */
function svgOf(a) { return '<svg viewBox="0 0 100 100" aria-hidden="true" focusable="false">' + a.svg + '</svg>'; }

/* ---------- 2) Estado del juego ---------- */
var state = {
  pairs: 0,          // cantidad de parejas de la partida
  first: null,       // primera tarjeta levantada (elemento) o null
  lock: false,       // true mientras se comparan dos tarjetas: bloquea una tercera
  moves: 0, found: 0,
  startTime: 0,      // marca de tiempo del primer giro (0 = aún no empezó)
  timerId: null,     // setInterval del cronómetro
  flipBackId: null   // setTimeout que da vuelta las tarjetas distintas
};
function $(id) { return document.getElementById(id); }

/* ---------- 3) Pantallas ---------- */
function show(id) {
  ['start', 'levels', 'game', 'win'].forEach(function (s) { $(s).classList.toggle('active', s === id); });
}

/* ---------- 4) Tablero ---------- */
function shuffle(arr) { /* Fisher-Yates: mezcla distinta en cada partida */
  for (var i = arr.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = arr[i]; arr[i] = arr[j]; arr[j] = t; }
  return arr;
}
function resetRound() { /* deja en cero todo lo de la partida anterior */
  clearInterval(state.timerId); state.timerId = null;
  clearTimeout(state.flipBackId); state.flipBackId = null;
  state.first = null; state.lock = false; state.moves = 0; state.found = 0; state.startTime = 0;
  $('moves').textContent = '0'; $('time').textContent = '0:00'; $('pairs').textContent = '0'; $('total').textContent = String(state.pairs);
  document.querySelectorAll('.confetti').forEach(function (n) { n.remove(); });
}
function startGame(n) {
  state.pairs = n; resetRound();
  var chosen = shuffle(ANIMALS.slice()).slice(0, n);         // n animales al azar
  var deck = shuffle(chosen.concat(chosen));                  // cada animal 2 veces, mezclados
  var board = $('board'); board.innerHTML = '';
  deck.forEach(function (a, i) {
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'card'; b.dataset.id = a.id; b.dataset.name = a.nombre;
    b.setAttribute('aria-label', 'Tarjeta ' + (i + 1) + ', boca abajo');
    b.innerHTML = '<span class="inner"><span class="face back"></span><span class="face front">' + svgOf(a) + '</span></span>';
    b.addEventListener('click', function () { onCard(b); });
    board.appendChild(b);
  });
  show('game'); fitBoard(); $('live').textContent = 'Nueva partida con ' + n + ' parejas.';
}
function fitBoard() { /* elige columnas y tamaño para aprovechar la pantalla (celular, tablet o compu) */
  var wrap = $('wrap'), board = $('board'), n = board.children.length; if (!n) return;
  var W = wrap.clientWidth, H = wrap.clientHeight, gap = Math.max(6, Math.min(14, W * 0.015)), best = { size: 0, cols: 2 };
  for (var cols = 2; cols <= n; cols++) {
    var rows = Math.ceil(n / cols);
    var size = Math.min((W - gap * (cols - 1)) / cols, (H - gap * (rows - 1)) / rows);
    if (size > best.size) best = { size: size, cols: cols };
  }
  /* preferimos filas completas (sin tarjetas sueltas) si el tamaño casi no se reduce */
  for (var c2 = 2; c2 <= n; c2++) {
    if (n % c2) continue;
    var r2 = n / c2, s2 = Math.min((W - gap * (c2 - 1)) / c2, (H - gap * (r2 - 1)) / r2);
    if (s2 >= best.size * 0.8 && s2 > (best.full || 0)) best.full = s2, best.fcols = c2;
  }
  if (best.fcols) best = { size: best.full, cols: best.fcols };
  var size = Math.max(40, Math.min(best.size, 170));
  board.style.setProperty('--size', size + 'px'); board.style.setProperty('--gap', gap + 'px');
  board.style.gridTemplateColumns = 'repeat(' + best.cols + ',' + size + 'px)';
}

/* ---------- 5) Lógica de pares ---------- */
function onCard(card) {
  if (state.lock) return;                                              // ya hay 2 tarjetas en comparación
  if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
  if (!state.startTime) startTimer();                                  // el tiempo corre desde el primer giro
  card.classList.add('flipped'); card.setAttribute('aria-label', card.dataset.name + ', boca arriba');
  if (!state.first) { state.first = card; return; }                    // primera de la pareja
  var a = state.first, b = card; state.first = null;
  state.moves++; $('moves').textContent = String(state.moves);
  if (a.dataset.id === b.dataset.id) {                                 // ¡pareja!
    a.classList.add('matched'); b.classList.add('matched');
    a.setAttribute('aria-label', a.dataset.name + ', pareja encontrada'); b.setAttribute('aria-label', b.dataset.name + ', pareja encontrada');
    state.found++; $('pairs').textContent = String(state.found);
    $('live').textContent = '¡Pareja de ' + a.dataset.name + '!';
    if (state.found === state.pairs) setTimeout(win, 700);
  } else {                                                             // no coinciden: bloquear y dar vuelta
    state.lock = true; a.classList.add('shake'); b.classList.add('shake');
    state.flipBackId = setTimeout(function () {
      [a, b].forEach(function (c) { c.classList.remove('flipped', 'shake'); c.setAttribute('aria-label', 'Tarjeta boca abajo'); });
      state.lock = false; state.flipBackId = null;
    }, 950);
  }
}

/* ---------- 6) Cronómetro ---------- */
function fmt(ms) { var s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60); }
function startTimer() {
  state.startTime = Date.now();
  state.timerId = setInterval(function () { $('time').textContent = fmt(Date.now() - state.startTime); }, 250);
}

/* ---------- 7) Victoria ---------- */
function win() {
  clearInterval(state.timerId); state.timerId = null;
  var ms = Date.now() - state.startTime, par = state.pairs;
  $('wMoves').textContent = String(state.moves); $('wTime').textContent = fmt(ms);
  var stars = state.moves <= par * 1.6 ? 3 : state.moves <= par * 2.6 ? 2 : 1;   // 1 a 3 estrellas según los movimientos
  $('stars').innerHTML = [1, 2, 3].map(function (i) { return '<span class="' + (i <= stars ? '' : 'off') + '">★</span>'; }).join('');
  show('win'); $('live').textContent = '¡Felicitaciones! Ganaste en ' + state.moves + ' movimientos.';
  var cols = ['#D52B1E', '#0038A8', '#2E9E68', '#F2A100', '#8727E2', '#E0457B'];
  for (var i = 0; i < 40; i++) {
    var c = document.createElement('i'); c.className = 'confetti';
    c.style.left = Math.random() * 100 + 'vw'; c.style.background = cols[i % cols.length];
    c.style.animationDuration = (2.2 + Math.random() * 2.4) + 's'; c.style.animationDelay = (Math.random() * .8) + 's';
    document.body.appendChild(c);
  }
  $('btnWinAgain').focus();
}

/* ---------- 8) Eventos ---------- */
(function init() {
  var hero = $('hero'); ['perro', 'gato', 'conejo', 'oso'].forEach(function (id) {
    var a = ANIMALS.filter(function (x) { return x.id === id; })[0]; hero.insertAdjacentHTML('beforeend', svgOf(a));
  });
  $('btnPlay').addEventListener('click', function () { show('levels'); });
  $('btnBackStart').addEventListener('click', function () { show('start'); });
  document.querySelectorAll('.level').forEach(function (b) { b.addEventListener('click', function () { startGame(parseInt(b.dataset.n, 10)); }); });
  function again() { startGame(state.pairs); }
  function changeLevel() { resetRound(); show('levels'); }
  $('btnAgain').addEventListener('click', again); $('btnWinAgain').addEventListener('click', again);
  $('btnLevel').addEventListener('click', changeLevel); $('btnWinLevel').addEventListener('click', changeLevel);
  window.addEventListener('resize', fitBoard); window.addEventListener('orientationchange', function () { setTimeout(fitBoard, 200); });
})();
</script>
